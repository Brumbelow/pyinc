version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      # `init` and `analyze` are two paths of one action and must run the same
      # version; bumped separately, each PR pairs a new half with an old one and
      # CodeQL fails.
      codeql-action:
        patterns:
          - "github/codeql-action*"
