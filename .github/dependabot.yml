version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      # `init` and `analyze` are two paths of one action and must run the same
      # version. Separate bumps would pair a new half with an old one and break
      # CodeQL.
      codeql-action:
        patterns:
          - "github/codeql-action*"
