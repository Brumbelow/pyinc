name: Benchmark

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark correctness and work counts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install benchmark dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/toolchain.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python scripts/check_toolchain.py --verify-installed

      - name: Run benchmark
        env:
          PYTHONHASHSEED: '0'
          PYTHONPATH: src
        run: python -m bench.run --output bench/results --repetitions 5

      - name: Upload benchmark report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ github.sha }}
          path: |
            bench/results/samples.csv
            bench/results/benchmark.csv
            bench/results/benchmark.md
            bench/results/metadata.json
          if-no-files-found: error
          retention-days: 90
