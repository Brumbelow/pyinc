name: Benchmark

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark correctness and work counts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[bench]'

      - name: Run benchmark
        env:
          PYTHONHASHSEED: '0'
          PYTHONPATH: src
        run: python -m bench.run --output bench/results --repetitions 5

      - name: Upload benchmark report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ github.sha }}
          path: |
            bench/results/samples.csv
            bench/results/benchmark.csv
            bench/results/benchmark.md
            bench/results/metadata.json
          if-no-files-found: error
          retention-days: 90
