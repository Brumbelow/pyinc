name: Benchmark

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark correctness and work counts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e '.[bench]'

      - name: Run benchmark
        env:
          PYTHONHASHSEED: '0'
          PYTHONPATH: src
        run: python -m bench.run --output bench/results --repetitions 5

      - name: Upload benchmark report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ github.sha }}
          path: |
            bench/results/samples.csv
            bench/results/benchmark.csv
            bench/results/benchmark.md
            bench/results/metadata.json
          if-no-files-found: error
          retention-days: 90
