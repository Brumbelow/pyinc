name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run test suite
        run: pytest -q

      - name: Smoke-check benchmark harness
        run: |
          PYTHONPATH=src python benchmarks/run_microbench.py \
            --bench diamond \
            --samples 2 \
            --warmup 0 \
            --rounds 1 \
            --payload-size 8 \
            --format table \
            --output-json /tmp/microbench-micro.json \
            --output-markdown /tmp/microbench-micro.md
          PYTHONPATH=src python benchmarks/run_microbench.py \
            --bench source_analysis \
            --samples 1 \
            --warmup 0 \
            --rounds 1 \
            --payload-size 8 \
            --format table \
            --output-json /tmp/microbench-workload.json \
            --output-markdown /tmp/microbench-workload.md
