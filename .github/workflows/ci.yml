name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }}, hash seed ${{ matrix.hash_seed }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONHASHSEED: ${{ matrix.hash_seed }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        hash_seed: ['0', '4294967295']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/toolchain.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python scripts/check_toolchain.py --verify-installed

      - name: Probe artifact-store process contention
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for attempt in {1..8}; do
            echo "Artifact-store canary attempt ${attempt}/8"
            python -m pytest -q --tb=long tests/test_store.py::test_filesystem_store_refuses_cross_process_conflicting_bytes
          done

      - name: Run test suite
        run: pytest -q -n auto --dist load

  quality:
    name: Static analysis and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/toolchain.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python scripts/check_toolchain.py --verify-installed

      - name: Type check
        run: python -m mypy src tests bench scripts

      - name: Lint
        run: python -m ruff check src tests bench scripts

      - name: Check documentation
        run: python scripts/check_docs.py

      - name: Measure branch coverage
        run: pytest -n auto --dist load --cov=pyinc --cov=pyinc_codegen --cov=pyinc_tools --cov-branch --cov-report=term-missing --cov-fail-under=90

  distribution:
    name: Build and validate installed artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Build distribution
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/toolchain.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python scripts/check_toolchain.py --verify-installed
          python -m scripts.reproducible_builds \
            --project-root . \
            --dist-output dist \
            --metadata-output build-metadata \
            --runner-label ubuntu-latest
          python -m scripts.reproducible_builds \
            --verify-existing \
            --dist-output dist \
            --metadata-output build-metadata \
            --version "$(python -c 'from importlib.metadata import version; print(version("pyinc"))')" \
            --runner-label ubuntu-latest
          python -m twine check dist/*

      - name: Create clean artifact environment
        run: |
          python -m venv .artifact-venv
          .artifact-venv/bin/python -m pip install --no-deps dist/*.whl

      - name: Validate installed packages and generated fixtures
        run: |
          .artifact-venv/bin/python scripts/validate_install.py --sdist dist/pyinc-*.tar.gz
          .artifact-venv/bin/pyinc-tools --version

      - name: Execute shipped examples
        run: |
          for example in examples/*.py; do
            echo "running installed-wheel example: ${example}"
            .artifact-venv/bin/python "$example"
          done
