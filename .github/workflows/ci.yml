name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Normalize Python root vars
        run: |
          echo "Python_ROOT_DIR=${pythonLocation}" >> "$GITHUB_ENV"
          echo "Python3_ROOT_DIR=${pythonLocation}" >> "$GITHUB_ENV"
          echo "Python2_ROOT_DIR=" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run test suite
        run: pytest -q
