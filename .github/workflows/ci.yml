name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Probe artifact-store process contention
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for attempt in {1..8}; do
            echo "Artifact-store canary attempt ${attempt}/8"
            python -m pytest -q --tb=long tests/test_store.py::test_filesystem_store_refuses_cross_process_conflicting_bytes
          done

      - name: Run test suite
        run: pytest -q -n auto --dist load --ignore=tests/test_properties.py

  test-properties:
    name: Properties (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run property suite
        run: pytest -q -n auto --dist load tests/test_properties.py

  quality:
    name: Static analysis and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Type check
        run: python -m mypy src tests bench scripts

      - name: Lint
        run: python -m ruff check src tests bench scripts

      - name: Check documentation
        run: python scripts/check_docs.py

      - name: Measure branch coverage
        run: pytest -n auto --dist load --cov=pyinc --cov=pyinc_codegen --cov=pyinc_tools --cov-branch --cov-report=term-missing --cov-fail-under=90

  distribution:
    name: Build and validate installed artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Create clean artifact environment
        run: |
          python -m venv .artifact-venv
          .artifact-venv/bin/python -m pip install --no-deps dist/*.whl

      - name: Validate installed packages and generated fixtures
        run: |
          .artifact-venv/bin/python scripts/validate_install.py --sdist dist/pyinc-*.tar.gz
          .artifact-venv/bin/pyinc-tools --version

      - name: Execute shipped examples
        run: |
          .artifact-venv/bin/python examples/correctness_demo.py
          .artifact-venv/bin/python examples/action_reconcile_demo.py
          .artifact-venv/bin/python examples/calc_demo.py
          .artifact-venv/bin/python examples/codegen_demo.py

  signed-history:
    name: Verify signed history
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Brumbelow/pyinc'
    env:
      EXPECTED_FINGERPRINT: 2B6DF408BD973740052925DC894C75E1B1D05EA2
      TRUSTED_BASELINE: 8db85ec7a647bd7b74bf04f07e94a9bd78675193
      ALLOWED_MERGE_COMMIT: 3cf59c6f0a2a24ef8306a8a1ded35ac482024dbc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Import the release signing key
        env:
          GNUPGHOME: ${{ runner.temp }}/pyinc-release-gnupg
        run: |
          install -d -m 700 "$GNUPGHOME"
          gpg --batch --import .github/release-signing-key.asc
          primary_count="$(gpg --batch --with-colons --list-keys | awk -F: '$1 == "pub" { count++ } END { print count + 0 }')"
          test "$primary_count" = 1
          actual_fingerprint="$(gpg --batch --with-colons --fingerprint | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$actual_fingerprint" = "$EXPECTED_FINGERPRINT"

      - name: Verify signed history
        env:
          GNUPGHOME: ${{ runner.temp }}/pyinc-release-gnupg
        run: |
          python scripts/verify_signed_history.py \
            --repository . \
            --baseline "$TRUSTED_BASELINE" \
            --head "$GITHUB_SHA" \
            --expected-fingerprint "$EXPECTED_FINGERPRINT" \
            --allowed-merge-commit "$ALLOWED_MERGE_COMMIT"
