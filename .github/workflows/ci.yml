name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run the suite unsharded on every operating system and interpreter
        type: boolean
        default: false
  workflow_call:
    inputs:
      full_matrix:
        description: Run the suite unsharded on every operating system and interpreter
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }}, shard ${{ matrix.shard }}/4)
    if: ${{ !inputs.full_matrix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.14']
        shard: [1, 2, 3, 4]
        exclude:
          - os: windows-latest
            python-version: '3.11'
          - os: macos-latest
            python-version: '3.11'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e '.[dev]'

      - name: Run test suite
        # Each cell runs as four jobs. PYINC_TEST_SHARD keeps the quarter of
        # the tests whose node id digest falls in this shard (tests/conftest.py).
        # The process tests check the repository as shipped and are platform
        # independent, so the quality job runs them once.
        env:
          PYINC_TEST_SHARD: ${{ matrix.shard }}/4
        run: pytest -n auto --dist load -m 'not process' --ignore=tests/test_properties.py --tb=short -rfEs

  test-full:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    if: ${{ inputs.full_matrix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.14t']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the free-threaded build with the GIL off
        if: endsWith(matrix.python-version, 't')
        # Free-threaded cells only, because a default build refuses PYTHON_GIL=0
        # at startup. Forcing the GIL off keeps an extension that would re-enable
        # it from turning these cells back into ordinary ones.
        shell: bash
        run: echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e '.[dev]'

      - name: Confirm the interpreter runs without the GIL
        if: endsWith(matrix.python-version, 't')
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess, sys, sysconfig
          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1, "not a free-threaded build"
          assert os.environ.get("PYTHON_GIL") == "0" and sys.flags.gil == 0, "PYTHON_GIL=0 is not in effect"
          import hypothesis, pytest, xdist
          import pyinc, pyinc.integrations, pyinc_codegen, pyinc_tools
          assert not sys._is_gil_enabled(), "the GIL is enabled"
          # pyinc is pure Python: importing it without the override must leave
          # the GIL off on its own.
          env = {key: value for key, value in os.environ.items() if key != "PYTHON_GIL"}
          probe = "import sys, pyinc, pyinc.integrations, pyinc_codegen, pyinc_tools; sys.exit(sys._is_gil_enabled())"
          subprocess.run([sys.executable, "-c", probe], env=env, check=True)
          print(sys.version)
          PY

      - name: Run test suite
        # The process tests check the repository as shipped and are platform
        # independent, so the quality job runs them once.
        run: pytest -n auto --dist load -m 'not process' --ignore=tests/test_properties.py --tb=short -rfEs

  test-properties:
    name: Properties (ubuntu-latest, Python 3.14, strict, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e '.[dev]'

      - name: Run property suite
        # The strict mode at a reduced example budget on every push and pull
        # request, as three jobs split by PYINC_TEST_SHARD (tests/conftest.py).
        # The full matrix at the written budgets runs nightly. Every case is
        # parametrized over the three modes, with the mode as the last parameter
        # in the identifier. The closing bracket keeps a case whose own name
        # reads "fast" out of the fast shard.
        shell: bash
        env:
          PYINC_PROPERTY_MAX_EXAMPLES: '10'
          PYINC_TEST_SHARD: ${{ matrix.shard }}/3
        run: python -m pytest -n auto --dist load -k "strict]" tests/test_properties.py --tb=short -rfEs

  quality:
    name: Static analysis and process tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e '.[dev]'

      - name: Type check
        run: python -m mypy src tests bench scripts examples

      - name: Type check for Windows
        # Catches a POSIX-only call before it reaches a Windows runner.
        run: python -m mypy --platform win32 src tests bench scripts examples

      - name: Lint
        run: python -m ruff check src tests bench scripts examples

      - name: Check documentation
        run: python scripts/check_docs.py

      - name: Run the process tests
        # The tests that check the repository as shipped. The test jobs skip
        # them, because they give the same result on every platform.
        run: python -m pytest -n auto --dist load -m process --tb=short -rfEs

  distribution:
    name: Build and validate installed artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Create clean artifact environment
        run: |
          python -m venv .artifact-venv
          .artifact-venv/bin/python -m pip install --no-deps dist/*.whl

      - name: Validate installed packages and generated fixtures
        run: |
          .artifact-venv/bin/python scripts/validate_install.py --sdist dist/pyinc-*.tar.gz
          .artifact-venv/bin/pyinc-tools --version

      - name: Execute shipped examples
        run: |
          .artifact-venv/bin/python examples/correctness_demo.py
          .artifact-venv/bin/python examples/action_reconcile_demo.py
          .artifact-venv/bin/python examples/calc_demo.py
          .artifact-venv/bin/python examples/codegen_demo.py
