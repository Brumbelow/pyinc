name: CI

on:
  push:
    branches:
      - '**'
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run test suite
        run: pytest -q

  test-macos:
    name: Test (macos-latest, Python ${{ matrix.python-version }}, ${{ matrix.shard }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        shard: [core, properties, tools]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Probe artifact-store process contention
        if: matrix.shard == 'core'
        shell: bash
        run: |
          for attempt in {1..8}; do
            echo "Artifact-store canary attempt ${attempt}/8"
            python -m pytest -q --tb=long tests/test_store.py::test_filesystem_store_refuses_cross_process_conflicting_bytes
          done

      - name: Run core test shard
        if: matrix.shard == 'core'
        run: >-
          python -m pytest -q --tb=long
          --ignore=tests/test_properties.py
          --ignore=tests/test_pyinc_tools.py
          --ignore=tests/test_pyinc_tools_workspace_helpers.py
          --ignore=tests/test_v3_tools.py

      - name: Run property test shard
        if: matrix.shard == 'properties'
        run: pytest -q tests/test_properties.py

      - name: Run tools test shard
        if: matrix.shard == 'tools'
        run: >-
          pytest -q
          tests/test_pyinc_tools.py
          tests/test_pyinc_tools_workspace_helpers.py
          tests/test_v3_tools.py

  quality:
    name: Static analysis and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Type check
        run: python -m mypy src tests bench scripts

      - name: Lint
        run: python -m ruff check src tests bench scripts

      - name: Check documentation
        run: python scripts/check_docs.py

      - name: Measure branch coverage
        run: pytest --cov=pyinc --cov=pyinc_codegen --cov=pyinc_tools --cov-branch --cov-report=term-missing --cov-fail-under=90

  distribution:
    name: Build and validate installed artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Create clean artifact environment
        run: |
          python -m venv .artifact-venv
          .artifact-venv/bin/python -m pip install --no-deps dist/*.whl

      - name: Validate installed packages and generated fixtures
        run: |
          .artifact-venv/bin/python scripts/validate_install.py --sdist dist/pyinc-*.tar.gz
          .artifact-venv/bin/pyinc-tools --version

      - name: Execute shipped examples
        run: |
          .artifact-venv/bin/python examples/correctness_demo.py
          .artifact-venv/bin/python examples/action_reconcile_demo.py
          .artifact-venv/bin/python examples/calc_demo.py
          .artifact-venv/bin/python examples/codegen_demo.py
