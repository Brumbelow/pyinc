name: Soundness mutation testing

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  mutation-gate:
    name: Kill soundness-critical mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install test tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/toolchain.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python scripts/check_toolchain.py --verify-installed

      - name: Run bounded soundness mutation gate
        run: python scripts/run_mutation_gate.py --timeout 45
