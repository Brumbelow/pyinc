name: Nightly

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-properties:
    name: Properties (${{ matrix.os }}, Python ${{ matrix.python-version }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.14t']
        shard: [strict, checked, fast]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the free-threaded build with the GIL off
        if: endsWith(matrix.python-version, 't')
        # Only on the free-threaded cells: a default build refuses PYTHON_GIL=0
        # at startup. Forcing it keeps an extension that would quietly re-enable
        # the GIL from turning these cells back into ordinary ones.
        shell: bash
        run: echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Confirm the interpreter runs without the GIL
        if: endsWith(matrix.python-version, 't')
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess, sys, sysconfig
          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1, "not a free-threaded build"
          assert os.environ.get("PYTHON_GIL") == "0" and sys.flags.gil == 0, "PYTHON_GIL=0 is not in effect"
          import hypothesis, pytest, xdist
          import pyinc, pyinc.integrations, pyinc_codegen, pyinc_tools
          assert not sys._is_gil_enabled(), "the GIL is enabled"
          # pyinc is pure Python: importing it without the override must leave
          # the GIL off on its own.
          env = {key: value for key, value in os.environ.items() if key != "PYTHON_GIL"}
          probe = "import sys, pyinc, pyinc.integrations, pyinc_codegen, pyinc_tools; sys.exit(sys._is_gil_enabled())"
          subprocess.run([sys.executable, "-c", probe], env=env, check=True)
          print(sys.version)
          PY

      - name: Run property suite
        # Every case in the file is parametrized over the three modes and the
        # mode is the last parameter in the identifier, so the closing bracket is
        # what keeps a case whose own name reads "fast" out of the fast shard.
        shell: bash
        run: python -m pytest -q -n auto --dist load -k "${{ matrix.shard }}]" tests/test_properties.py
