name: Nightly

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-properties:
    name: Properties (${{ matrix.os }}, Python ${{ matrix.python-version }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        shard: [strict, checked, fast]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run property suite
        # Every case in the file is parametrized over the three modes and the
        # mode is the last parameter in the identifier, so the closing bracket is
        # what keeps a case whose own name reads "fast" out of the fast shard.
        shell: bash
        run: python -m pytest -q -n auto --dist load -k "${{ matrix.shard }}]" tests/test_properties.py
