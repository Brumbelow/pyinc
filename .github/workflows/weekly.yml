name: Weekly

# The suite and every property mode at its written budget, on the oldest and
# the newest supported interpreter. GitHub sets CI, so Hypothesis loads its ci
# profile, which derandomizes: each run on a commit draws the same examples.
# A failure on an unchanged commit comes from a new interpreter release or
# runner image.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (ubuntu-latest, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e '.[dev]'

      - name: Run test suite
        run: pytest -n auto --dist load -m 'not process' --ignore=tests/test_properties.py --tb=short -rfEs

  test-properties:
    name: Properties (ubuntu-latest, Python ${{ matrix.python-version }}, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
        mode: [strict, checked, fast]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e '.[dev]'

      - name: Run property suite
        # One mode per job keeps each job inside the six-hour limit. Every case
        # in the file is parametrized over the three modes, with the mode as the
        # last parameter in the identifier. The closing bracket keeps a case
        # whose own name reads "fast" out of the fast job.
        shell: bash
        run: python -m pytest -n auto --dist load -k "${{ matrix.mode }}]" tests/test_properties.py --tb=short -rfEs
