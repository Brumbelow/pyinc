[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pyinc"
version = "2.5.0"
description = "A correctness-first incremental query engine for Python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Andrew Brumbelow", email = "andrew.brumbelow@gmail.com" }
]
keywords = ["incremental-computation", "query-kernel", "salsa", "red-green", "backdating", "provenance"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
pyinc-tools = "pyinc_tools.cli:main"

[project.urls]
Homepage = "https://github.com/Brumbelow/pyinc"
Repository = "https://github.com/Brumbelow/pyinc"
Issues = "https://github.com/Brumbelow/pyinc/issues"

[project.optional-dependencies]
dev = [
  "hypothesis>=6.0",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
]
# Benchmark-only comparison dependencies. Never imported by src/pyinc or
# src/pyinc_codegen — used only by the bench/ harness.
bench = [
  "joblib>=1.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyinc", "src/pyinc_codegen", "src/pyinc_tools"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --tb=no"

[tool.mypy]
python_version = "3.11"
mypy_path = ["examples"]
warn_return_any = true
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_reexport = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
files = ["src", "tests"]

# bench/ is a benchmark harness, not shipped and not part of the gate paths
# (`mypy src tests`). The smoke test imports it, so silence it here rather than
# type-checking it strictly.
[[tool.mypy.overrides]]
module = ["bench", "bench.*"]
ignore_missing_imports = true
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]
ignore = ["E501"]  # line length handled by formatter
